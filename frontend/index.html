<!DOCTYPE html>
<!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
<!-- SPDX-FileCopyrightText: 2026 Samons -->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>MiniDeck</title>

  <!-- PWA / pantalla completa en iPhone -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MiniDeck">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#0f1216">

  <link rel="stylesheet" href="style.css?v=41">
  <!-- aplica el tema guardado antes de pintar, para evitar parpadeo -->
  <script>
    try { var t = localStorage.getItem("minideck-theme");
          if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
  </script>
  <!-- Sin JavaScript: ir a la versión con formularios -->
  <noscript><meta http-equiv="refresh" content="0; url=/basic"></noscript>
</head>
<body>
  <!-- Sin JavaScript: la versión con formularios (todo funciona igual, sin tiempo real) -->
  <noscript>
    <p style="padding:24px;text-align:center">
      <a href="/basic" style="color:#60a5fa">MiniDeck sin JavaScript →</a></p>
  </noscript>
  <div class="splash" id="splash">
    <img class="splash-logo" src="icons/icon-192.png" alt="">
    <div class="splash-title">MiniDeck</div>
    <div class="splash-by">by Samons · AGPL-3.0</div>
  </div>

  <header class="topbar">
    <div class="brand">
      <span class="status-dot" id="statusDot" data-i18n-title="status.title"></span>
      <h1 id="deckName">MiniDeck</h1>
      <span class="version">v1.1</span>
    </div>
    <div class="top-right">
      <div class="system-state" id="systemState"></div>
      <button class="icon-btn" id="profileBtn" data-i18n-title="top.profile">◎</button>
      <button class="icon-btn" id="themeBtn" data-i18n-title="top.theme">◑</button>
      <button class="icon-btn" id="fsBtn" data-i18n-title="top.fullscreen">⛶</button>
      <button class="icon-btn" id="editBtn" data-i18n-title="top.edit">✎</button>
      <button class="icon-btn lang-btn" id="langBtn" data-i18n-title="top.lang">ES</button>
      <a class="icon-btn about-link" id="aboutBtn" href="https://github.com/SamonsLol/minideck"
         target="_blank" rel="noopener"
         data-i18n-title="top.about">ⓘ</a>
    </div>
  </header>

  <nav class="pages" id="pageTabs"></nav>

  <main class="grid" id="grid"></main>

  <button class="fs-exit" id="fsExit" data-i18n-title="fs.exit">✕</button>

  <div class="offline-banner" id="offlineBanner" role="alert" data-i18n="offline" hidden></div>

  <div class="a2hs" id="a2hs">
    <span id="a2hsText" data-i18n="a2hs.text"></span>
    <button id="a2hsInstall" style="display:none" data-i18n="a2hs.install">Install</button>
    <button id="a2hsClose" data-i18n-title="a2hs.close">✕</button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="i18n.js?v=41"></script>
  <script src="auth.js?v=41"></script>
  <script src="app.js?v=41"></script>
</body>
</html>
